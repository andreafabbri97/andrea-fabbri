    <title>Andrea Fabbri — Management Engineer & AI Automation</title>
    <meta name="description" content="Portfolio of Andrea Fabbri, Management Engineer from San Marino: production software that replaces manual operations." />
    <!-- Theme before the first paint: the saved choice, or the system one. No flash. -->
    <script>
      (function () {
        var scelta = 'auto';
        try { scelta = localStorage.getItem('af-tema') || 'auto'; } catch (e) {}
        var scuro = scelta === 'dark' || (scelta === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.tema = scuro ? 'dark' : 'light';
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
