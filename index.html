<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F3F6F8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1822" media="(prefers-color-scheme: dark)" />
    <!-- Title, description, canonical, hreflang, Open Graph text and structured data, in the page's language:
         written by scripts/prerender.mjs at build time (data in src/entry-server.jsx). -->
    <!--seo-->
    <link rel="sitemap" type="application/xml" href="https://andreafabbri97.github.io/andrea-fabbri/sitemap.xml" />
    <!-- Google Search Console ownership check: keep it, or the property stops being verified. -->
    <meta name="google-site-verification" content="5mMiXcCV0CfK620hkf2HrTids6xyH0-70ZXRT2Jzyxo" />
    <!-- The preview shown when the link is shared (WhatsApp, LinkedIn, Slack...). Absolute URLs: the crawlers need them. -->
    <meta property="og:image" content="https://andreafabbri97.github.io/andrea-fabbri/anteprima.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Andrea Fabbri, management engineer, over the contour lines of Monte Titano" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Theme before the first paint: the saved choice, or the system one. No flash. -->
    <script>
      (function () {
        var scelta = 'auto';
        try { scelta = localStorage.getItem('af-tema') || 'auto'; } catch (e) {}
        var scuro = scelta === 'dark' || (scelta === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.tema = scuro ? 'dark' : 'light';
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,400..900&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
